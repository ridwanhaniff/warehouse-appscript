<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="logo-192.png">
  <link rel="apple-touch-icon" href="logo-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ina Warehouse">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ina Basic Store Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    #reader {
      border: 0 !important;
    }

    #reader video {
      object-fit: cover;
    }

    .spinner {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 antialiased">
  <div class="mx-auto flex min-h-screen max-w-md flex-col">
    <header class="flex items-center justify-between gap-3 bg-slate-900 px-5 pb-6 pt-8 text-white">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Ina Basic Store Logo" class="h-10 w-10 rounded-xl object-contain bg-white/10 p-1">
        <div>
          <p class="text-xs uppercase tracking-widest text-slate-400">Warehouse</p>
          <h1 class="text-lg font-semibold leading-tight">Ina Basic Store</h1>
        </div>
      </div>
      <button id="btn-install" type="button"
        class="hidden shrink-0 rounded-full bg-white/10 px-3.5 py-1.5 text-xs font-medium text-white ring-1 ring-white/20 active:bg-white/20">
        Pasang Aplikasi
      </button>
    </header>
    <main class="flex-1 px-5 py-6">

      <!-- HOME -->
      <section id="screen-home">
        <h2 class="mb-4 text-sm font-medium text-slate-500">Pilih aktivitas</h2>
        <div id="activity-list" class="grid grid-cols-2 gap-4"></div>
        <p id="ios-hint"
          class="mt-6 hidden rounded-xl bg-white p-4 text-xs leading-relaxed text-slate-500 ring-1 ring-slate-200">
          Untuk memasang sebagai aplikasi di iPhone: buka lewat Safari, ketuk tombol <strong>Bagikan (Share)</strong>, lalu pilih <strong>"Tambah ke Layar Utama"</strong>.
        </p>
      </section>

      <!-- SCANNER -->
      <section id="screen-scan" class="hidden">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="scan-title" class="text-lg font-semibold"></h2>
          <button id="btn-cancel-scan"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 active:bg-slate-200">Batal</button>
        </div>
        <div class="overflow-hidden rounded-2xl bg-black shadow-lg">
          <div id="reader" class="min-h-[260px] w-full"></div>
        </div>
        <button id="btn-manual-toggle" class="mx-auto mt-5 block text-sm font-medium text-indigo-600 underline">Ketik
          manual</button>
        <form id="manual-form" class="mt-3 hidden gap-2">
          <input id="manual-barcode" type="text" inputmode="numeric" placeholder="Masukkan barcode"
            class="flex-1 rounded-xl border px-4 py-3 focus:ring-2">
          <button type="submit" class="rounded-xl bg-slate-900 px-5 text-white">OK</button>
        </form>
      </section>

      <!-- FORM TRANSAKSI -->
      <section id="screen-form" class="hidden">
        <div class="mb-4 flex items-center justify-between">
          <h2 id="form-title" class="text-lg font-semibold"></h2>
          <button id="btn-back" class="rounded-lg px-3 py-2 text-sm text-slate-600 active:bg-slate-200">Batal</button>
        </div>
        <form id="trx-form" class="space-y-5 rounded-2xl bg-white p-5 shadow-sm" novalidate>

          <div>
            <label class="mb-1 block text-sm font-medium text-slate-600">Barcode</label>
            <input id="f-barcode" type="text" readonly
              class="w-full rounded-xl bg-slate-50 px-4 py-3 font-mono text-slate-600">
          </div>

          <div id="row-sku" class="hidden">
            <label class="mb-1 block text-sm font-medium text-slate-600">SKU</label>
            <input id="f-sku" type="text" placeholder="mis. KS-001"
              class="w-full rounded-xl border px-4 py-3 focus:ring-2 uppercase">
          </div>

          <div id="row-nama" class="hidden">
            <label class="mb-1 block text-sm font-medium text-slate-600">Nama Produk</label>
            <input id="f-nama" type="text" placeholder="mis. Kaos Polos Hitam"
              class="w-full rounded-xl border px-4 py-3 focus:ring-2">
          </div>

          <div id="row-from">
            <label id="label-from" class="mb-1 block text-sm font-medium text-slate-600">Lokasi Asal</label>
            <div id="dd-from"></div>
          </div>

          <div id="row-to">
            <label id="label-to" class="mb-1 block text-sm font-medium text-slate-600">Lokasi Tujuan</label>
            <div id="dd-to"></div>
          </div>

          <div id="row-qty">
            <label id="label-qty" class="mb-1 block text-sm font-medium text-slate-600">Kuantitas</label>
            <input id="f-qty" type="number" inputmode="numeric" placeholder="0"
              class="w-full rounded-xl border px-4 py-3 text-2xl font-semibold focus:ring-2">
          </div>

          <button id="btn-submit" type="submit"
            class="flex w-full justify-center rounded-xl bg-indigo-600 px-4 py-4 font-semibold text-white disabled:bg-slate-400">
            <span id="btn-submit-text">Simpan Data</span>
          </button>
        </form>
      </section>

    </main>
  </div>
  <div id="toast-root" class="fixed inset-x-0 top-0 z-50 flex flex-col items-center gap-2 p-4 transition"
    aria-live="polite"></div>

  <script>
    const GAS_URL = 'PASTE_URL_APPS_SCRIPT_DISINI';

    const LOCATIONS = [
      { value: 'Rak Utama', label: 'Rak Utama', dot: 'bg-indigo-500' },
      { value: 'Shopee', label: 'Shopee', dot: 'bg-orange-500' },
      { value: 'TikTok Shop', label: 'TikTok Shop', dot: 'bg-slate-900' }
    ];

    const ACTIVITIES = {
      masuk: { label: 'Barang Masuk', value: 'Masuk', color: 'bg-emerald-100 text-emerald-700', fields: ['to'], labelTo: 'Toko Tujuan', labelQty: 'Stok Masuk', min: 1 },
      keluar: { label: 'Barang Keluar', value: 'Keluar', color: 'bg-rose-100 text-rose-700', fields: ['from'], labelFrom: 'Toko Asal', labelQty: 'Stok Keluar', min: 1 },
      mutasi: { label: 'Pindah Lokasi', value: 'Mutasi', color: 'bg-sky-100 text-sky-700', fields: ['from', 'to'], labelFrom: 'Toko Asal', labelTo: 'Toko Tujuan (Selain Asal)', min: 1 },
      opname: { label: 'Stock Opname', value: 'Opname', color: 'bg-amber-100 text-amber-700', fields: ['to'], labelTo: 'Lokasi Opname', labelQty: 'Hasil Fisik', min: 0 },
      produk: { label: 'Produk Baru', value: 'ProdukBaru', color: 'bg-violet-100 text-violet-700', fields: ['to'], labelTo: 'Lokasi Awal', labelQty: 'Stok Awal', min: 0, isProd: true, wide: true }
    };

    const $ = id => document.getElementById(id);
    let state = { key: null, barcode: '', trxId: null };
    let scanner = null;

    // Toast Alert
    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `p-4 rounded-xl shadow-lg text-white font-medium ${type === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
      el.textContent = msg;
      $('toast-root').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    // Dropdown Pintar (Mendukung Exclude Opsi)
    function createDropdown(rootId, labelId) {
      const root = $(rootId);
      let value = ''; let excluded = '';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'flex w-full items-center justify-between border bg-white px-4 py-3 rounded-xl focus:ring-2 text-left';
      const label = document.createElement('span');
      btn.append(label, '▼');

      const menu = document.createElement('ul');
      menu.className = 'absolute z-20 mt-1 hidden w-full rounded-xl border bg-white shadow-xl';

      const items = [];
      const api = {
        get value() { return value; },
        set(v) { value = v; render(); },
        exclude(v) {
          excluded = v;
          if (value === v) api.reset();
          render();
        },
        reset() { value = ''; excluded = ''; render(); menu.classList.add('hidden'); },
        onChange: null
      };

      function render() {
        label.textContent = value ? LOCATIONS.find(l => l.value === value).label : 'Pilih...';
        items.forEach(it => {
          it.li.classList.toggle('hidden', it.val === excluded);
          it.li.style.backgroundColor = (it.val === value) ? '#f8fafc' : 'white';
        });
      }

      LOCATIONS.forEach(loc => {
        const li = document.createElement('li');
        li.className = 'px-4 py-3 hover:bg-slate-50 cursor-pointer border-b';
        li.textContent = loc.label;
        li.onclick = () => { api.set(loc.value); menu.classList.add('hidden'); if (api.onChange) api.onChange(loc.value); };
        menu.appendChild(li);
        items.push({ li, val: loc.value });
      });

      btn.onclick = () => menu.classList.toggle('hidden');
      root.append(btn, menu);
      api.reset();
      return api;
    }

    const ddFrom = createDropdown('dd-from', 'label-from');
    const ddTo = createDropdown('dd-to', 'label-to');

    // Fitur Pindah Lokasi: Tujuan tidak boleh sama dengan Asal
    ddFrom.onChange = (val) => {
      if (state.key === 'mutasi') ddTo.exclude(val);
    };

    function renderActivities() {
      Object.entries(ACTIVITIES).forEach(([k, a]) => {
        const btn = document.createElement('button');
        btn.className = `p-4 rounded-xl border bg-white font-semibold active:bg-slate-50 ${a.wide ? 'col-span-2' : ''} ${a.color}`;
        btn.textContent = a.label;
        btn.onclick = () => startScan(k);
        $('activity-list').appendChild(btn);
      });
    }

    function show(id) { ['home', 'scan', 'form'].forEach(x => $(`screen-${x}`).classList.toggle('hidden', x !== id)); }

    async function startScan(key) {
      state = { key, trxId: null };
      $('scan-title').textContent = ACTIVITIES[key].label;
      $('manual-form').classList.add('hidden'); $('manual-barcode').value = '';
      show('scan');

      scanner = new Html5Qrcode('reader');
      try {
        await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (text) => {
          scanner.stop(); openForm(text);
        }, () => { });
      } catch (e) {
        $('manual-form').classList.remove('hidden');
      }
    }

    function openForm(barcode) {
      const a = ACTIVITIES[state.key];
      state.barcode = barcode;
      $('form-title').textContent = a.label;
      $('f-barcode').value = barcode;
      $('f-sku').value = ''; $('f-nama').value = ''; $('f-qty').value = '';
      ddFrom.reset(); ddTo.reset();

      $('row-sku').classList.toggle('hidden', !a.isProd); $('row-nama').classList.toggle('hidden', !a.isProd);

      const hasFrom = a.fields.includes('from');
      const hasTo = a.fields.includes('to');
      $('row-from').classList.toggle('hidden', !hasFrom); $('row-to').classList.toggle('hidden', !hasTo);

      if (hasFrom) $('label-from').textContent = a.labelFrom;
      if (hasTo) $('label-to').textContent = a.labelTo;
      $('label-qty').textContent = a.labelQty || 'Kuantitas'; $('f-qty').placeholder = `Min: ${a.min}`;

      show('form');
    }

    $('trx-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const a = ACTIVITIES[state.key];
      const from = ddFrom.value, to = ddTo.value, qty = Number($('f-qty').value);

      if (a.isProd) {
        const sku = $('f-sku').value.trim(), nama = $('f-nama').value.trim();
        if (!sku || !nama || !to) return toast('SKU, Nama, dan Lokasi wajib diisi!', 'error');
        if ($('f-qty').value === '' || qty < 0) return toast('Isi stok awal (min 0)', 'error');
        state.trxId = state.trxId || `TRX-${Date.now()}`;
        return kirimData({ transaction_id: state.trxId, activity: a.value, barcode: state.barcode, sku, nama, location_to: to, qty });
      }

      if (a.fields.includes('from') && !from) return toast('Pilih Lokasi Asal', 'error');
      if (a.fields.includes('to') && !to) return toast('Pilih Lokasi Tujuan', 'error');
      if ($('f-qty').value === '' || qty < a.min) return toast('Kuantitas tidak valid', 'error');

      state.trxId = state.trxId || `TRX-${Date.now()}`;
      kirimData({ transaction_id: state.trxId, activity: a.value, barcode: state.barcode, location_from: from, location_to: to, qty });
    });

    async function kirimData(payload) {
      $('btn-submit').disabled = true; $('btn-submit-text').textContent = 'Menyimpan...';
      try {
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
        const json = await res.json();
        toast(json.message, json.success ? 'success' : 'error');
        if (json.success) { show('home'); }
      } catch (e) {
        toast('Gagal koneksi server. Coba simpan lagi.', 'error');
      } finally {
        $('btn-submit').disabled = false; $('btn-submit-text').textContent = 'Simpan Data';
      }
    }

    $('btn-cancel-scan').onclick = () => { if (scanner) scanner.stop(); show('home'); }; $('btn-back').onclick = () => show('home');
    $('btn-manual-toggle').onclick = () => $('manual-form').classList.toggle('hidden');
    $('manual-form').onsubmit = (e) => { e.preventDefault(); if (scanner) scanner.stop(); openForm($('manual-barcode').value); };

    renderActivities();
    show('home');

    // ===================== PWA & Service Worker =====================
    let deferredInstall = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstall = e;
      if (!isStandalone) $('btn-install').classList.remove('hidden');
    });

    $('btn-install').addEventListener('click', async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      const choice = await deferredInstall.userChoice;
      if (choice && choice.outcome === 'accepted') {
        $('btn-install').classList.add('hidden');
      }
      deferredInstall = null;
    });

    window.addEventListener('appinstalled', () => {
      $('btn-install').classList.add('hidden');
      toast('Aplikasi berhasil dipasang.');
    });

    if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !isStandalone) {
      $('ios-hint').classList.remove('hidden');
    }

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => console.log('Service Worker terdaftar:', reg.scope))
          .catch((err) => console.error('Service Worker gagal:', err));
      });
    }
  </script>
</body>

</html>
